# Builds the desktop app on Windows, macOS and Linux.
# Push a tag like v1.0.0 to attach the archives to a GitHub release, or run it by hand
# (Actions > Desktop builds > Run workflow) to get them as workflow artifacts.
name: Desktop builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: downloads/phonewand-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
