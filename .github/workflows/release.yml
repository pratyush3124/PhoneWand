# Builds the desktop app on Windows, macOS (Apple silicon and Intel) and Linux (x64).
# Push a tag like v1.0.0 to attach the archives to a GitHub release, or run it by hand
# (Actions > Desktop builds > Run workflow) to get them as workflow artifacts.
name: Desktop builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      # The packaged executable starts (its bundle and SEA blob are intact)
      - name: Smoke test
        shell: bash
        run: |
          app=$(ls -d dist/phonewand-*/ | head -1)
          if [ -f "$app/PhoneWand.exe" ]; then "$app/PhoneWand.exe" --help; else "$app/phonewand" --help; fi
      # On Linux, also load the mouse library in a virtual X11 display and print a room
      - name: Smoke test (Linux, X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          (PHONEWAND_TERMINAL=1 timeout 15 xvfb-run -a dist/phonewand-linux-x64/phonewand --no-tunnel || true) | tee out.txt
          grep -q "Room " out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: downloads/phonewand-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
